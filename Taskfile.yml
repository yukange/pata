version: '3'

tasks:
  build:
    summary: Builds the native macOS application bundle
    cmds:
      - ./scripts/build_swift_app.sh release

  install:
    summary: Builds release bundle and installs to /Applications/pata.app
    cmds:
      - ./scripts/build_swift_app.sh release
      - ./scripts/install_swift_app.sh

  test:
    summary: Runs Swift test suite
    cmds:
      - swift test -Xswiftc -plugin-path -Xswiftc /Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/usr/lib/swift/host/plugins -Xswiftc -plugin-path -Xswiftc /Library/Developer/CommandLineTools/usr/lib/swift/host/plugins/testing

  run:
    summary: Runs Pata.app
    cmds:
      - open /Applications/pata.app

