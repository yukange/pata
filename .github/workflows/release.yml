name: Development Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-macos:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Clean SemVer Version
        id: get_version
        env:
          RAW_TAG: ${{ github.ref_name }}
        run: |
          CLEAN_VERSION="${RAW_TAG#v}"
          if [ -z "${CLEAN_VERSION}" ] || [ "${RAW_TAG}" = "main" ]; then
            CLEAN_VERSION="0.1.1"
          fi
          echo "version=${CLEAN_VERSION}" >> $GITHUB_OUTPUT

      - name: Run Swift Unit Tests
        run: |
          swift test

      - name: Build macOS Native App Bundle
        run: |
          ./scripts/build_swift_app.sh

      - name: Package Release Assets
        run: |
          mkdir -p bin
          cd build/bin
          zip -r -y "../../bin/pata-macos-arm64.app.zip" "Pata.app"
          hdiutil create -volname "Pata" -srcfolder "Pata.app" -ov -format UDZO "../../bin/pata.dmg"
          cd ../..
          cd bin
          shasum -a 256 pata.dmg pata-macos-arm64.app.zip > SHA256SUMS
          cd ..

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pata-development-macos-${{ steps.get_version.outputs.version }}
          path: |
            bin/*.app.zip
            bin/*.dmg
            bin/SHA256SUMS

      # Official publishing stays disabled until Developer ID signing, notarization,
      # and Gatekeeper verification are configured and pass. These are development artifacts.
