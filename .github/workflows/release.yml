name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Clean SemVer Version
        id: get_version
        run: |
          RAW_TAG="${{ github.ref_name }}"
          CLEAN_VERSION="${RAW_TAG#v}"
          if [ -z "${CLEAN_VERSION}" ] || [ "${RAW_TAG}" = "main" ]; then
            CLEAN_VERSION="0.1.1"
          fi
          echo "version=${CLEAN_VERSION}" >> $GITHUB_OUTPUT
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag_name=${RAW_TAG}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=v${CLEAN_VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Run Swift Unit Tests
        run: |
          swift test

      - name: Build macOS Native App Bundle
        run: |
          ./scripts/build_swift_app.sh

      - name: Package Release Assets
        run: |
          mkdir -p bin
          cd build/bin
          zip -r -y "../../bin/pata-macos-arm64.app.zip" "Pata.app"
          hdiutil create -volname "Pata" -srcfolder "Pata.app" -ov -format UDZO "../../bin/pata.dmg"
          cd ../..
          cd bin
          shasum -a 256 pata.dmg pata-macos-arm64.app.zip > SHA256SUMS
          cd ..

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pata-macos-${{ steps.get_version.outputs.version }}
          path: |
            bin/*.app.zip
            bin/*.dmg
            bin/SHA256SUMS

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: "Pata v${{ steps.get_version.outputs.version }}"
          files: |
            bin/*.app.zip
            bin/*.dmg
            bin/SHA256SUMS
          draft: false
          prerelease: false
          generate_release_notes: true
