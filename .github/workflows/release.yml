name: Development Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-macos:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Clean SemVer Version
        id: get_version
        env:
          RAW_TAG: ${{ github.ref_name }}
        run: |
          CLEAN_VERSION="${RAW_TAG#v}"
          if [ -z "${CLEAN_VERSION}" ] || [ "${RAW_TAG}" = "main" ]; then
            CLEAN_VERSION="0.1.1"
          fi
          echo "version=${CLEAN_VERSION}" >> $GITHUB_OUTPUT

      - name: Select Xcode 16
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_PATH" ]; then
            echo "Selecting $XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Run Swift Unit Tests
        run: |
          DEV_DIR="$(xcode-select -p)"
          PLUGIN_FLAGS=()
          for p in \
            "$DEV_DIR/Platforms/MacOSX.platform/Developer/usr/lib/swift/host/plugins" \
            "$DEV_DIR/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/host/plugins/testing" \
            "/Library/Developer/CommandLineTools/usr/lib/swift/host/plugins/testing"; do
            if [ -d "$p" ]; then
              PLUGIN_FLAGS+=("-Xswiftc" "-plugin-path" "-Xswiftc" "$p")
            fi
          done
          swift test "${PLUGIN_FLAGS[@]}"

      - name: Build macOS Native App Bundle
        run: |
          ./scripts/build_swift_app.sh

      - name: Package Release Assets
        run: |
          mkdir -p bin
          cd build/bin
          zip -r -y "../../bin/pata-macos-arm64.app.zip" "Pata.app"
          hdiutil create -volname "Pata" -srcfolder "Pata.app" -ov -format UDZO "../../bin/pata.dmg"
          cd ../..
          cd bin
          shasum -a 256 pata.dmg pata-macos-arm64.app.zip > SHA256SUMS
          cd ..

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pata-development-macos-${{ steps.get_version.outputs.version }}
          path: |
            bin/*.app.zip
            bin/*.dmg
            bin/SHA256SUMS

      # Official publishing stays disabled until Developer ID signing, notarization,
      # and Gatekeeper verification are configured and pass. These are development artifacts.
